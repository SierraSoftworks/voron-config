# systemd drop-in for caddy.service: /etc/systemd/system/caddy.service.d/override.conf
#
# Caddy's `tracing` directive (see networking/Caddyfile) exports request spans
# over OTLP gRPC to the local OpenTelemetry Collector (monitoring/), which
# forwards them on. Reload with `systemctl daemon-reload && systemctl restart caddy`.
[Service]
Environment="OTEL_SERVICE_NAME=caddy"
Environment="OTEL_EXPORTER_OTLP_PROTOCOL=grpc"
Environment="OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://localhost:4317"
